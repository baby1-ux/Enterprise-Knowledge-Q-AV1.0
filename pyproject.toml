[project]
name = "rag-qa-system"
version = "1.0.0"
description = "基于企业内容知识库的 RAG 问答系统（FastAPI + Milvus + DeepSeek + Vue3）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.1",
    "cryptography>=42.0.0",
    "pymilvus>=2.5.0",
    "openai>=1.40.0",
    "PyJWT>=2.8.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "pillow>=10.3.0",
    "pypdf>=4.2.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.2",
    "requests>=2.32.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# 本地向量化 / 重排模型（默认走 dashscope，无需安装）
local-models = ["sentence-transformers>=2.7.0", "torch>=2.3.0"]
# 本地 OCR（默认走 dashscope 云端 qwen-vl-ocr）
ocr = ["pytesseract>=0.3.10"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-ra -q"
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 MySQL / Milvus / DeepSeek + DashScope API Key 的集成测试（默认跳过）",
]

[tool.ruff]
line-length = 120
target-version = "py310"
